services:
  redis:
    image: redis:7
    container_name: t2-redis
    ports: ["6379:6379"]
    # Persistencia: AOF con fsync cada segundo (se justifica en el README)
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  hbase:
    build: .
    container_name: t2-hbase
    ports: ["16010:16010", "9090:9090"]
    volumes:
      - hbase_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  redis_data:
  hbase_data: